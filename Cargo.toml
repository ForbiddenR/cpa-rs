[package]
name = "cpa-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls-native-roots", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
thiserror = "2"
url = "2"
uuid = "1"
yaml_serde = "0"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
